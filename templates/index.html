<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI — Intelligent File & Data Processor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            text-transform: uppercase;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
            font-weight: 700;
        }

        p {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 0;
            line-height: 1.5;
        }

        /* AI Prompt Box Container */
        .ai-prompt-wrapper {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px;
            margin-top: 20px;
            transition: border-color 0.2s;
        }

        .ai-prompt-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .ai-textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            resize: none;
            outline: none;
            height: 80px;
            box-sizing: border-box;
            padding: 4px;
        }

        .ai-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(51, 65, 85, 0.5);
            padding-top: 10px;
            margin-top: 8px;
        }

        /* Plus Attachment Button Style */
        .attach-btn-wrapper {
            position: relative;
            display: inline-block;
        }

        .plus-btn {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .plus-btn:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Hidden real file input */
        .hidden-file-input {
            display: none;
        }

        .file-status {
            font-size: 12px;
            color: var(--success, #10b981);
            margin-left: 10px;
            font-weight: 500;
        }

        .submit-btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: var(--accent-hover);
        }

        .chips-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .chip {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip:hover {
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="badge">✨ Autonomous AI Engine</span>
            <h2>Nexus Data Intelligence</h2>
            <p>Attach your file using the '+' button, type your instruction, and run the pipeline.</p>
        </div>

        <form action="/upload" method="POST" enctype="multipart/form-data">
            
            <div class="ai-prompt-wrapper">
                <!-- Instruction Text Area -->
                <textarea class="ai-textarea" id="instructionBox" name="instruction" placeholder="Ask AI to process file (e.g., extract emails, remove duplicates, uppercase)..." required></textarea>
                
                <div class="ai-toolbar">
                    <div style="display: flex; align-items: center;">
                        <!-- Plus Attachment Button -->
                        <div class="attach-btn-wrapper">
                            <button type="button" class="plus-btn" onclick="document.getElementById('fileInput').click()" title="Attach File">+</button>
                            <input type="file" id="fileInput" name="file" class="hidden-file-input" accept=".txt,.csv" onchange="showFileName(this)" required>
                        </div>
                        <span id="fileStatus" class="file-status">No file attached</span>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="submit-btn">Run Pipeline</button>
                </div>
            </div>

            <!-- Quick Suggestion Chips -->
            <div class="chips-container">
                <div class="chip" onclick="setCommand('extract emails')">Extract Emails</div>
                <div class="chip" onclick="setCommand('extract phone')">Extract Phones</div>
                <div class="chip" onclick="setCommand('remove duplicates')">Deduplicate</div>
                <div class="chip" onclick="setCommand('mask privacy')">Mask Sensitive Data</div>
                <div class="chip" onclick="setCommand('uppercase')">Uppercase</div>
            </div>

        </form>
